<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Obsidian Dark Surface Gradient matching current theme -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1f2b" />
      <stop offset="50%" stop-color="#13131c" />
      <stop offset="100%" stop-color="#0c0c10" />
    </linearGradient>

    <!-- Electric Indigo Glow -->
    <radialGradient id="indigo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#4f46e5" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Silver Aperture Loops -->
    <linearGradient id="aperture-grad-1" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Electric Indigo Play Iris Center -->
    <linearGradient id="aperture-grad-2" x1="14" y1="12" x2="21" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
  </defs>

  <!-- Titanium Bezel Container with Highlight Border -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bg-grad)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1" />
  
  <!-- Subtle Indigo Glow -->
  <circle cx="16" cy="16" r="12" fill="url(#indigo-glow)" />

  <!-- Continuous Loop Segments forming Aperture S -->
  <path
    d="M9 7C7.89543 7 7 7.89543 7 9V17.5C7 18.3284 7.67157 19 8.5 19H12.5C13.3284 19 14 18.3284 14 17.5V11C14 9.89543 14.8954 9 16 9H23C24.1046 9 25 8.10457 25 7C25 5.89543 24.1046 5 23 5H11C9.89543 5 9 5.89543 9 7Z"
    fill="url(#aperture-grad-1)"
  />
  <path
    d="M23 25C24.1046 25 25 24.1046 25 23V14.5C25 13.6716 24.3284 13 23.5 13H19.5C18.6716 13 18 13.6716 18 14.5V21C18 22.1046 17.1046 23 16 23H9C7.89543 23 7 23.8954 7 25C7 26.1046 7.89543 27 9 27H21C22.1046 27 23 26.1046 23 25Z"
    fill="url(#aperture-grad-1)"
    opacity="0.88"
  />
  
  <!-- Dynamic Play Iris Center -->
  <polygon points="14,12 21,16 14,20" fill="url(#aperture-grad-2)" />
</svg>
